[project]
name = "timer"
version = "0.1.0"
description = "Terminal countdown timer"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "onth0s" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "click>=8.3.0",
    "rich>=14.0.0",
    "rich-click>=1.9.0",
    "pyyaml>=6.0",
]

[project.urls]
repository = "https://github.com/onth0s/timer"

[project.scripts]
timer = "countdown.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "coverage[toml]>=7.5.1",
    "ruff>=0.4.0",
    "drawille>=0.2.0",
    "windows-curses>=2.4.0",
    "smooth-text-animation>=0.1.2",
    "ghostprint>=2.0.0",
    "asciimatics>=1.15.0",
]

[tool.coverage.paths]
source = ["src", "*/site-packages"]
tests = ["tests", "*/tests"]

[tool.coverage.run]
branch = true
source = ["countdown", "tests"]

[tool.coverage.report]
show_missing = true
fail_under = 100

[build-system]
requires = ["uv_build>=0.10.9,<0.11"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.9.6"

[tool.uv.build-backend]
module-name = "countdown"

[tool.ruff]
target-version = "py310"
line-length = 80

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "S",      # flake8-bandit
    "D",      # pydocstyle
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "D107",   # missing docstring in __init__
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D102", "D103"]
"scratch/*" = ["S311"]
"src/countdown/pulses/*" = ["S311", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
